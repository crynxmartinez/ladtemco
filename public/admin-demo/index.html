<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ladtemco · Admin demo</title><style>:root {
  color-scheme: light;
  --bg:#f3f5f2; --surface:#fff; --ink:#172a22; --muted:#55665e; --line:#dce5de; --subtle:#edf3ee;
  --green:#146143; --green-fg:#fff; --soft:#e3f1e7; --amber:#80510d; --amber-bg:#fff0d1;
  --red:#942e27; --red-bg:#fae9e4; --blue:#245b76; --blue-bg:#e8f1f7;
  --side:#123c2e; --side-text:#d7e6dd; --side-muted:#a2c1af; --side-line:#315445;
  --shadow:0 2px 5px #193a2009;
  font:15px/1.45 'Segoe UI',sans-serif;
}
:root[data-theme="dark"] {
  color-scheme:dark;
  --bg:#121d18; --surface:#192720; --ink:#edf5ef; --muted:#b1c3b7; --line:#344a3d; --subtle:#22342a;
  --green:#8ad9ad; --green-fg:#103122; --soft:#243d30; --amber:#f7d689; --amber-bg:#46391f;
  --red:#ffb5a9; --red-bg:#462b2a; --blue:#a2d8f0; --blue-bg:#253c47;
  --side:#102c23; --side-line:#315445; --shadow:none;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
button,a,input,select{outline-offset:4px}
:focus-visible{outline:2px solid #b37311}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
svg{flex:none;vertical-align:middle}
h1,h2,h3,p{margin:0}
h1{font-size:43px;line-height:1.1;letter-spacing:-.045em;font-weight:730}
h2{font-size:20px;line-height:1.22;letter-spacing:-.025em}
h3{font-size:15px}
small,.muted{color:var(--muted)}
.shell{display:grid;grid-template-columns:242px minmax(0,1fr);min-height:100vh}
aside.nav{position:sticky;top:0;align-self:start;height:100vh;overflow:auto;padding:22px 15px 16px;background:var(--side);color:var(--side-text);display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:11px;padding:2px 7px 17px;border-bottom:1px solid var(--side-line)}
.brand img{width:44px;height:44px;border-radius:50%;object-fit:cover;background:white}
.brand b{font-size:17px;letter-spacing:.06em;color:white}
.brand span,.account small{display:block;color:var(--side-muted);font-size:12px}
.nav section{margin-top:13px}
.nav section h2{padding:0 10px 5px;font-size:10px;line-height:1.4;letter-spacing:.12em;text-transform:uppercase;color:var(--side-muted)}
.nav a.item{display:flex;align-items:center;gap:10px;padding:7px 10px;min-height:36px;border-radius:7px;font-size:14px;font-weight:600;position:relative;white-space:nowrap}
.nav a.item:hover{background:#ffffff14}
.nav a[aria-current]{background:#f3d389;color:#302c1d;font-weight:720}
.nav a[aria-current]::after{content:'';position:absolute;right:10px;width:5px;height:5px;background:#764a0a;border-radius:100%}
.account{padding:12px 6px 0;margin-top:auto;border-top:1px solid var(--side-line);display:flex;align-items:center;gap:10px;color:white}
.avatar{height:35px;width:35px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--green);font-size:12px;font-weight:750}
.account .avatar{background:#336451;color:white}
.topbar{height:61px;border-bottom:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:space-between;padding:0 34px}
.topbar .location{display:flex;gap:11px;align-items:center;font-size:13px;font-weight:650;color:var(--muted)}
.topbar .location strong{color:var(--ink)}
.topbar .utils,.actions{display:flex;align-items:center;gap:9px}
.main{padding:30px 34px 34px;max-width:1475px;margin:auto}
.hero{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:23px}
.hero p{margin-top:8px;color:var(--muted);font-size:15px}
.button,.filter,.iconbutton{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:39px;border:1px solid var(--line);border-radius:7px;background:var(--surface);font-size:13px;font-weight:700;padding:0 12px;white-space:nowrap}
.button.primary{background:var(--green);color:var(--green-fg);border-color:var(--green)}
.iconbutton{width:39px;padding:0}
.pill{display:inline-flex;gap:6px;align-items:center;width:max-content;white-space:nowrap;border-radius:100px;padding:4px 9px;background:var(--subtle);color:var(--muted);font-size:12px;font-weight:700;line-height:1.2}
.pill.green{background:var(--soft);color:var(--green)}
.pill.amber{background:var(--amber-bg);color:var(--amber)}
.pill.red{background:var(--red-bg);color:var(--red)}
.pill.blue{background:var(--blue-bg);color:var(--blue)}
.metrics{display:grid;grid-template-columns:repeat(var(--items), minmax(0,1fr));gap:14px;margin:0 0 17px}
.metric,.panel{border:1px solid var(--line);border-radius:11px;background:var(--surface);box-shadow:var(--shadow);min-width:0}
.metric{padding:14px 16px 13px;display:flex;gap:11px;align-items:flex-start}
.metric .symbol{background:var(--soft);color:var(--green);border-radius:7px;width:34px;height:34px;display:grid;place-items:center}
.metric.amber .symbol{background:var(--amber-bg);color:var(--amber)}
.metric.blue .symbol{background:var(--blue-bg);color:var(--blue)}
.metric span:not(.symbol){display:block;font-size:13px;font-weight:650;color:var(--muted)}
.metric strong{display:block;font-size:28px;font-weight:730;letter-spacing:-.035em;line-height:1.12;margin:3px 0 2px}
.metric small{font-size:11px}
.grid{display:grid;grid-template-columns:minmax(0,2.15fr) minmax(280px,1fr);gap:15px;align-items:start}
.grid.even{grid-template-columns:repeat(2,minmax(0,1fr))}
.stack{display:grid;gap:15px}
.panel-head{padding:16px 18px 13px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.panel-head p{font-size:13px;color:var(--muted);margin-top:4px}
.panel-body{padding:0 18px 16px}
.toolbar{display:flex;align-items:center;gap:8px;padding:0 18px 13px;flex-wrap:wrap}
.search{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:7px;min-height:38px;min-width:180px;flex:1;padding:0 10px;color:var(--muted)}
.search input{width:100%;border:0;background:none;padding:8px 0;font-size:13px;color:var(--ink)}
.search input::placeholder{color:var(--muted)}
.tabs{display:flex;gap:20px;padding:0 18px;margin-bottom:13px;border-bottom:1px solid var(--line)}
.tabs span{color:var(--muted);font-size:13px;font-weight:650;padding:6px 0 10px}
.tabs .selected{border-bottom:2px solid var(--green);color:var(--green);margin-bottom:-1px}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;text-align:left;font-size:13px;white-space:nowrap}
th{background:var(--subtle);color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.038em;font-weight:720}
th,td{padding:11px 15px;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{padding-left:18px}
th:last-child,td:last-child{padding-right:18px}
td.numeric,th.numeric{text-align:right}
td strong,td small{display:block}
td small{margin-top:2px;font-size:11px}
td:last-child{width:1%}
tr.selected td{background:var(--soft)}
td .row-action,.link{color:var(--green);font-weight:720;display:inline-flex;gap:4px;align-items:center}
.panel-foot{padding:11px 18px;color:var(--muted);font-size:12px;display:flex;align-items:center;justify-content:space-between}
.note{padding:11px 13px;border:1px solid var(--line);border-radius:7px;background:var(--subtle);color:var(--muted);font-size:13px;display:flex;gap:8px;align-items:flex-start}
.note.amber{border-color:transparent;background:var(--amber-bg);color:var(--amber)}
.note.green{border-color:transparent;background:var(--soft);color:var(--green)}
.note svg{margin-top:2px}
.list-entry{display:flex;align-items:center;justify-content:space-between;gap:11px;min-height:56px;padding:10px 0;border-bottom:1px solid var(--line)}
.list-entry:last-child{border-bottom:0}
.list-entry strong,.list-entry small{display:block}
.list-entry small{margin-top:2px;font-size:12px}
.list-entry .entry-left{display:flex;gap:10px;align-items:center}
.entry-icon{width:35px;height:35px;display:grid;place-items:center;background:var(--soft);color:var(--green);border-radius:7px;flex:none}
dl{margin:0 0 12px}
dl div{display:flex;gap:10px;justify-content:space-between;border-bottom:1px solid var(--line);padding:9px 0;font-size:13px}
dt{color:var(--muted)}
dd{margin:0;font-weight:720;text-align:right}
.workflow{display:flex;align-items:center;gap:9px;padding:11px 14px;margin-bottom:16px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:13px;color:var(--muted);flex-wrap:wrap}
.workflow a,.workflow strong{padding:4px 7px;border-radius:5px}
.workflow a:hover{background:var(--subtle)}
.workflow strong{background:var(--soft);color:var(--green)}
.progress{height:8px;border-radius:8px;background:var(--subtle);overflow:hidden}
.progress i{display:block;height:100%;border-radius:8px;background:var(--green)}
.barline{display:grid;grid-template-columns:135px minmax(55px,1fr) 58px;gap:10px;align-items:center;font-size:13px;margin:16px 0}
.barline strong{text-align:right}
.subhead{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:7px;text-transform:uppercase;letter-spacing:.06em}
.callout{border-radius:10px;padding:16px 18px;background:var(--soft);display:flex;gap:16px;align-items:center;justify-content:space-between}
.callout p{color:var(--muted);margin-top:5px;font-size:13px}
.before-after{display:grid;grid-template-columns:1fr auto 1fr;gap:9px;align-items:center;margin:10px 0 14px}
.before-after div{padding:11px 12px;border-radius:7px;background:var(--subtle)}
.before-after strong,.before-after small{display:block}
.before-after strong{font-size:21px}
.full{width:100%;margin-top:11px}
.mobile-nav{display:none}
@media(max-width:1200px){.main{padding-inline:22px}.topbar{padding-inline:22px}.shell{grid-template-columns:218px 1fr}.grid{grid-template-columns:minmax(0,1fr) 290px}th,td{padding-inline:11px}}
@media(min-width:681px) and (max-width:1200px){.nav a.item{font-size:12px;gap:8px}}
@media(max-width:980px){.grid,.grid.even{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{align-items:start}.hero .actions{flex-wrap:wrap;justify-content:end}}
@media(max-width:680px){.shell{display:block}.mobile-nav{display:block}.nav:not(.opened){display:none}aside.nav.opened{position:fixed;z-index:2;width:245px;box-shadow:0 0 0 100vw #0006}.topbar{padding-inline:12px}.main{padding:18px 12px}.hero{flex-direction:column}.hero .actions{justify-content:start}.hero h1{font-size:35px}.metric strong{font-size:23px}.metric{padding:11px}.metric small{display:none}.barline{grid-template-columns:112px 1fr 45px}}

[hidden]{display:none!important}
button:hover,.button:hover{filter:brightness(.96)}
.brand b{word-break:break-word}
.tabs button,.row-action,.action-entry{appearance:none;border:0;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer}
.tabs button{border-bottom:2px solid transparent;padding:8px 0 10px;color:var(--muted);font-size:13px;font-weight:650}
.tabs button[aria-pressed=true]{color:var(--green);border-bottom-color:var(--green)}
.row-action{white-space:nowrap;padding:4px 0}
.action-entry{width:100%;border-bottom:1px solid var(--line)}
.action-entry:hover,.option-list button:hover{background:var(--subtle)}
.action-entry small,.action-entry strong{display:block}
.empty{text-align:center;padding:30px 12px;color:var(--muted)}
.scrim{position:fixed;inset:0;z-index:10;background:rgba(8,21,16,.58);display:grid;place-items:center;padding:18px}
.dialog{width:min(560px,100%);max-height:calc(100vh - 36px);display:flex;flex-direction:column;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 20px 65px #071a133d}
.dialog header{display:flex;align-items:start;justify-content:space-between;gap:18px;padding:22px 24px 17px;border-bottom:1px solid var(--line)}
.dialog h2{font-size:26px;letter-spacing:-.035em;line-height:1.12}
.kicker{font-size:11px;font-weight:720;letter-spacing:.08em;text-transform:uppercase;color:var(--green);margin-bottom:7px}
.dialog-body{padding:20px 24px;overflow:auto;min-height:0}
.dialog footer{padding:14px 22px;background:var(--bg);display:flex;align-items:center;justify-content:flex-end;gap:9px;border-top:1px solid var(--line);flex-wrap:wrap}
.dialog footer .dismiss{margin-right:auto}
.close-x{border:1px solid var(--line);border-radius:7px;background:var(--subtle);width:33px;height:33px;color:var(--muted);font:23px/1 sans-serif}
.field{display:block;margin-top:13px}
.field span{font-size:13px;font-weight:690;display:block;margin-bottom:5px}
.field input,.field select,.field textarea{display:block;border:1px solid var(--line);border-radius:6px;padding:9px 11px;background:var(--bg);color:var(--ink);width:100%;font:14px/1.35 'Segoe UI',sans-serif;min-height:39px}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--green);outline-offset:1px}
.field input::placeholder,.field textarea::placeholder{color:var(--muted);opacity:.83}
.field small{font-size:12px}
.form-intro,.lead{margin-bottom:14px;font-size:14px;line-height:1.5;color:var(--muted)}
.form-error{background:var(--red-bg);color:var(--red);margin-top:12px;padding:9px 11px;border-radius:5px}
.option-list{display:grid;gap:6px}
.option-list button{width:100%;text-align:left;padding:10px 14px;border:1px solid var(--line);border-radius:7px;background:var(--surface);display:flex;justify-content:space-between}
.option-list button[aria-pressed=true]{background:var(--soft);color:var(--green);font-weight:700;border-color:var(--green)}
.detail-block{margin:0 0 16px}
.detail-block h3{margin-bottom:8px}
.detail-block li,.agenda li{margin:6px 0}
.dialog dl:last-child,.detail-block:last-child,.dialog .lead:last-child{margin-bottom:0}
.dialog dd{max-width:65%;overflow-wrap:anywhere}
.mini-table{overflow-x:auto;border:1px solid var(--line);border-radius:7px}
.mini-table td,.mini-table th{padding:8px 10px;font-size:12px;white-space:normal}
.mini-table td:last-child{width:auto}
.result-icon{width:44px;height:44px;display:grid;place-items:center;color:var(--green);background:var(--soft);border-radius:50%;margin-bottom:12px}
.result-icon svg{width:23px;height:23px}
.amount{font-size:32px;font-weight:720;color:var(--green);margin-bottom:4px}
body.modal-open{overflow:hidden}
#announcement:not(:empty):not([hidden]){position:fixed;z-index:12;bottom:24px;right:24px;max-width:400px;border:1px solid var(--green);background:var(--surface);color:var(--ink);padding:12px 18px;border-radius:9px;box-shadow:var(--shadow)}
@media(max-width:680px){.dialog header,.dialog-body{padding:15px}.dialog footer{padding:12px}.scrim{padding:9px}.dialog{max-height:calc(100dvh - 18px)}.brand b{font-size:14px}}

.dialog{width:min(1000px,100%);max-width:100%;max-height:calc(100dvh - 48px);border:1px solid var(--line);border-radius:18px;box-shadow:0 24px 80px #07171055}
.dialog[data-size="compact"]{width:min(720px,100%)}
.dialog>header{flex:none;align-items:center;gap:20px;padding:26px 32px 24px;background:#154331;color:#fff;border:0;border-top:4px solid #dfbc71}
:root[data-theme=dark] .dialog>header{background:#173a2e}
.dialog>header .kicker{color:#e5cc94;font-size:11px;letter-spacing:.11em;margin:0 0 7px}
.dialog>header h2{font-size:clamp(26px,3vw,36px);line-height:1.12;letter-spacing:-.035em;overflow-wrap:anywhere}
.dialog .close-x{flex:none;width:40px;height:40px;background:transparent;color:#f7fbf8;border-color:#749080;font-size:25px}
.dialog-body{padding:26px 32px 30px;overscroll-behavior:contain}
.dialog-body h3{margin:16px 0 10px;font-size:16px;line-height:1.25}
.dialog-body>h3:first-child,.dialog-body .detail-block h3:first-child{margin-top:0}
.dialog .lead,.dialog .form-intro,.dialog .meeting-info{font-size:15px;line-height:1.55}
.dialog-body dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 24px;margin:0 0 18px}
.dialog-body dl>div{display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;gap:4px;min-width:0;padding:12px 0;border-bottom:1px solid var(--line)}
.dialog-body dt{font-size:12px;color:var(--muted)}
.dialog-body dd{max-width:100%;font-size:16px;text-align:left;font-weight:650;overflow-wrap:anywhere}
.dialog-body dl:last-child,.dialog-body .detail-block:last-child{margin-bottom:0}
.modal-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:0 0 22px}
.modal-stat{min-width:0;padding:16px 18px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.modal-stat span,.amount-banner small{display:block;color:var(--muted);font-size:12px;font-weight:650}
.modal-stat strong,.amount-banner strong{display:block;margin-top:5px;font-size:clamp(23px,2.6vw,32px);font-weight:720;letter-spacing:-.035em;line-height:1.15;overflow-wrap:anywhere}
.modal-stat.emphasis,.amount-banner{background:var(--soft);color:var(--green)}
.modal-stat.attention{background:var(--amber-bg);color:var(--amber)}
.amount-banner{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:18px 20px;margin-bottom:18px;border-radius:10px}
.dialog-body .detail-block{padding:17px 20px;border:1px solid var(--line);border-radius:10px;margin:0 0 16px}
.modal-columns{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(220px,1fr);gap:22px;align-items:start}
.modal-columns>*{min-width:0}
.modal-columns .side-facts{border:1px solid var(--line);border-radius:10px;padding:17px 18px;background:var(--bg)}
.side-facts h3:first-child{margin-top:0}
.side-facts dl{grid-template-columns:1fr}
.dialog .mini-table th,.dialog .mini-table td{padding:11px 12px;font-size:14px}
.dialog .mini-table th{font-size:11px;letter-spacing:.04em}
.dialog .paper{padding:22px 24px;background:var(--surface);border-left:4px solid #cdaa62}
.dialog .paper p{font-size:15px;line-height:1.55}
.dialog .field{margin:0;min-width:0}
.dialog form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 20px}
.dialog form .field:only-of-type,.dialog .wide-field,.dialog form [role=alert],.dialog .form-summary{grid-column:1/-1}
.dialog .field span{margin-bottom:7px}
.dialog .field input,.dialog .field select,.dialog .field textarea{min-height:46px;background:var(--surface);border-color:var(--line)}
.dialog .field input[type=file]{background:var(--bg);border-style:dashed}
.dialog .field small{display:block;margin-top:5px}
.dialog .form-summary{padding:13px 16px;border-radius:8px;background:var(--soft);color:var(--green);font-size:14px}
.dialog .form-summary[data-warning=true]{background:var(--amber-bg);color:var(--amber)}
.dialog .option-list,.dialog .more-menu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.dialog .option-list button,.dialog .more-menu a{min-width:0;min-height:46px;padding:12px;border:1px solid var(--line);border-radius:8px}
.dialog .agenda{padding-left:24px;line-height:1.65}
.dialog .dialog-body .action-entry{min-height:54px;padding:8px 4px}
.dialog>footer{flex:none;gap:10px;padding:16px 28px;background:var(--subtle)}
.dialog>footer .button{min-height:44px;padding:9px 17px;font-size:14px;white-space:normal}
.dialog .note{margin-top:12px}
@media(max-width:680px){
  .scrim{padding:7px}
  .dialog,.dialog[data-size=compact]{width:calc(100% - 4px);max-height:calc(100dvh - 20px);border-radius:12px}
  .dialog>header{padding:17px 16px}.dialog>header h2{font-size:25px}
  .dialog-body{padding:16px}.dialog-body dl{gap:0 12px}
  .modal-columns,.dialog form{grid-template-columns:1fr}
  .dialog .more-menu{grid-template-columns:1fr}
  .dialog .mini-table th,.dialog .mini-table td{padding:8px 6px}
  .modal-stats{grid-template-columns:repeat(auto-fit,minmax(115px,1fr));gap:7px}
  .modal-stat{padding:12px}.dialog .field input,.dialog .field select,.dialog .field textarea{font-size:16px}
  .dialog>footer{padding:10px;gap:6px}.dialog>footer .button{padding:8px 10px}
  .dialog .detail-block,.dialog .paper{padding:12px}.dialog-body dd{font-size:14px}

function modalText(value) {
  return String(value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
}
function modalStats(rows) {
  return '<div class="modal-stats">'+rows.map(([label,value,tone])=>
    '<div class="modal-stat '+(tone || '')+'"><span>'+modalText(label)+'</span><strong>'+modalText(value)+'</strong></div>'
  ).join('')+'</div>';
}
function modalSplit(content, title, details) {
  return '<div class="modal-columns"><div>'+content+'</div><aside class="side-facts"><h3>'+modalText(title)+'</h3>'+details+'</aside></div>';
}
function modalAmount(label,value,status) {
  return '<div class="amount-banner"><div><small>'+modalText(label)+'</small><strong>'+modalText(value)+'</strong></div>'+status+'</div>';
}

const menus = [
  ['overview', 'Overview', 'LayoutDashboard', 'Workspace'],
  ['members', 'Members', 'Users', 'Membership'],
  ['contributions', 'Contributions', 'Coins', 'Membership'],
  ['share-capital', 'Share Capital', 'WalletCards', 'Membership'],
  ['funds', 'Funds & Budgets', 'Landmark', 'Finance'],
  ['expenses', 'Expenses & Advances', 'Receipt', 'Finance'],
  ['liquidations', 'Liquidations', 'ClipboardCheck', 'Finance'],
  ['approvals', 'Approvals', 'ListChecks', 'Governance'],
  ['reports', 'Reports', 'ChartNoAxesCombined', 'Governance'],
  ['meetings-documents', 'Meetings & Documents', 'Files', 'Governance'],
  ['audit-trail', 'Audit Trail', 'History', 'Governance'],
  ['users-roles', 'Users & Roles', 'ShieldCheck', 'System'],
  ['settings', 'Settings', 'Settings', 'System'],
];

const icon = (name) => window.previewIcons?.[name] || '';
const badge = (label, tone = '') => `<span class="pill ${tone}">${label}</span>`;
const button = (label, pictogram, primary = false) => `<button class="button${primary ? ' primary' : ''}" type="button">${icon(pictogram)}${label}</button>`;
const rowAction = (label) => `<span class="row-action">${label} ${icon('ChevronRight')}</span>`;
const cell = (title, caption) => `<strong>${title}</strong><small>${caption}</small>`;
const head = (title, detail = '', right = '') => `<header class="panel-head"><div><h2>${title}</h2>${detail ? `<p>${detail}</p>` : ''}</div>${right}</header>`;
const panel = (title, detail, html, right = '') => `<section class="panel">${head(title, detail, right)}<div class="panel-body">${html}</div></section>`;
const note = (message, tone = '', shape = 'Info') => `<div class="note ${tone}">${icon(shape)}<span>${message}</span></div>`;
const facts = (rows) => `<dl>${rows.map(([key, value]) => `<div><dt>${key}</dt><dd>${value}</dd></div>`).join('')}</dl>`;
const tabs = (...labels) => `<div class="tabs">${labels.map((label, i) => `<span class="${i === 0 ? 'selected' : ''}">${label}</span>`).join('')}</div>`;
const filter = (label) => `<span class="filter">${label}${icon('ChevronDown')}</span>`;
const tools = (search, ...filters) => `<div class="toolbar"><label class="search">${icon('Search')}<input type="search" aria-label="${search}" placeholder="${search}"></label>${filters.map(filter).join('')}</div>`;
const metrics = (...rows) => `<div class="metrics" style="--items:${rows.length}">${rows.map(([label,value,detail,symbol,tone='']) => `<div class="metric ${tone}"><span class="symbol">${icon(symbol)}</span><div><span>${label}</span><strong>${value}</strong><small>${detail}</small></div></div>`).join('')}</div>`;
const grid = (first, second, equal = false) => `<div class="grid${equal ? ' even' : ''}">${first}<div class="stack">${second}</div></div>`;
const list = (rows) => rows.map(([title,sub,symbol,right]) => `<div class="list-entry"><div class="entry-left"><span class="entry-icon">${icon(symbol)}</span><div><strong>${title}</strong><small>${sub}</small></div></div>${right ?? icon('ChevronRight')}</div>`).join('');
const progress = (pct) => `<div class="progress" role="progressbar" aria-label="Utilization" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>`;
const bar = (label, pct, value) => `<div class="barline"><span>${label}</span>${progress(pct)}<strong>${value}</strong></div>`;
const workflow = (current) => `<nav class="workflow" aria-label="Finance workflow">${[['funds','Approved budget'],['expenses','Expense or advance'],['approvals','Approval & release'],['liquidations','Liquidation'],['reports','Reporting']].map(([id,label]) => id===current ? `<strong>${label}</strong>` : `<a href="#${id}">${label}</a>`).join(icon('ChevronRight'))}</nav>`;

function table(title, detail, headers, rows, { controls = '', selected = -1, foot = `${rows.length} sample records` } = {}) {
  const numeric = (index) => headers[index].startsWith('!');
  return `<section class="panel">${head(title, detail)}${controls}<div class="table-wrap"><table aria-label="${title}">
    <thead><tr>${headers.map((header, i) => `<th scope="col" class="${numeric(i) ? 'numeric' : ''}">${header.replace(/^!/, '')}</th>`).join('')}</tr></thead>
    <tbody>${rows.map((row, i) => `<tr class="${i === selected ? 'selected' : ''}">${row.map((value, j) => `<td class="${numeric(j) ? 'numeric' : ''}">${value}</td>`).join('')}</tr>`).join('')}</tbody>
    </table></div><footer class="panel-foot">${foot}</footer></section>`;
}

function fieldOptions(type,example){
  if(type==='choice')return String(example).split('|').map(x=>[x,x]);
  const map={member:'members',capital:'share-capital',fund:'funds',advance:'expenses'};
  let rows=demo.tables[map[type]];
  if(!rows)return null;
  if(type==='member')rows=rows.filter(r=>r.values[2]==='Active');
  if(type==='capital')rows=rows.filter(r=>valueOfMoney(r.values[3])>0);
  if(type==='advance')rows=rows.filter(r=>r.values[1]==='Cash advance' && r.values[4]==='Released' && !demo.tables.liquidations.some(l=>l.values[1]===r.id));
  return rows.map(r=>[r.id,`${r.values[0]} · ${type==='advance'?r.values[3]+' · ':''}${r.id}`]);
}
function formDialog(title,context,fields,submit,onSubmit,{initial={},description='',back}={}){
  const inputs=fields.map(([label,type,example])=>{
    const options=fieldOptions(type,example),name=esc(label),value=initial[label]??(type==='date'?demoDay:'');
    let control;
    if(options)control=`<select name="${name}" required>${options.length?'':'<option value="">No eligible records</option>'}${options.map(([id,text])=>`<option value="${esc(id)}" ${id===value?'selected':''}>${esc(text)}</option>`).join('')}</select>`;
    else if(type==='long')control=`<textarea rows="2" maxlength="500" name="${name}" placeholder="${esc(example)}" required>${esc(value)}</textarea>`;
    else if(type==='file')control=`<input type="file" name="${name}" accept=".txt,.pdf,text/plain,application/pdf" required><small>PDF or text · up to 256 KB</small>`;
    else {
      const numeric=['money','integer','nonnegative'].includes(type);
      control=`<input type="${numeric?'number':type}" name="${name}" value="${esc(value)}" ${numeric?`min="${type==='nonnegative'?0:type==='integer'?1:.01}" max="999999999" step="${type==='integer'?1:'.01'}"`:'maxlength="120"'} placeholder="${esc(example||'')}" required>`;
    }
    return `<label class="field${['long','file','advance'].includes(type)?' wide-field':''}"><span>${name}</span>${control}</label>`;
  }).join('');
  dialog(title,context,`<p class="form-intro">${esc(description)}</p><form id="record-form">${inputs}<p role="alert" class="form-error" hidden></p></form>`,[textButton(submit,()=>modalHost.querySelector('form').requestSubmit(),true)],{back});
  const form=modalHost.querySelector('form'),error=form.querySelector('[role=alert]');
  if(title==='Start liquidation'||title==='Record capital payment'){
    const summary=document.createElement('output');
    summary.className='form-summary';
    form.insertBefore(summary,error);
    const update=()=>{
      const v=Object.fromEntries(new FormData(form));
      const advance=title==='Start liquidation';
      const row=advance?byId('expenses',v['Released advance']):byId('share-capital',v.Member);
      if(!row){summary.textContent=advance?'No released advances are available.':'No outstanding capital balances.';return;}
      const balance=valueOfMoney(row.values[3]);
      const applied=advance?Number(v['Supported spending'])+Number(v['Cash returned']):Number(v['Amount received']);
      const remaining=Math.round((balance-applied)*100)/100;
      summary.dataset.warning=String(remaining<0);
      summary.textContent=(advance?'Cash released ':'Outstanding balance ')+peso(balance)+' · '+(advance?'Still to account for ':'Balance after payment ')+peso(remaining);
    };
    form.addEventListener('input',update);update();
  }
  form.onsubmit=async e=>{
    e.preventDefault();
    const values=Object.fromEntries(new FormData(form));
    for(const k of Object.keys(values))if(typeof values[k]==='string')values[k]=values[k].trim();
    if(Object.values(values).some(v=>v==='')){error.textContent='Complete the required fields.';error.hidden=false;return;}
    const b=modalHost.querySelector('[data-command]');b.disabled=true;
    try{await onSubmit(values);}
    catch(err){error.textContent=err.message;error.hidden=false;}
    finally{b.disabled=false;}
  };
}

async function createRecord(title,v){
  const [key]=plans[title];let r;
  if(key==='members'){
    r=record(nextRef('MEM'),[v['Member name'],'—','Pending review','—'],'Review',v);
    addApproval(r,'Membership','—');
  }else if(key==='contributions'){
    if(demo.tables[key].some(r=>r.extra['Receipt reference']===v['Receipt reference']))throw new Error('This receipt reference already exists.');
    r=record(nextRef('CON'),[dateText(v['Payment date']),byId('members',v.Member).values[0],v.Category,peso(v['Amount received']),'For verification'],'Verify',v);
    addApproval(r,'Contribution',r.values[3]);
  }else if(key==='share-capital'){
    const member=byId(key,v.Member),amount=Number(v['Amount received']),outstanding=valueOfMoney(member.values[3]);
    if(amount>outstanding)throw new Error('Payment exceeds the outstanding share capital of '+peso(outstanding)+'.');
    if(demo.tables.transactions.some(x=>x.extra['Receipt reference']===v['Receipt reference']))throw new Error('This receipt reference already exists.');
    member.values[2]=peso(valueOfMoney(member.values[2])+amount);member.values[3]=peso(outstanding-amount);
    const directory=byId('members',member.id);if(directory)directory.values[3]=member.values[2];
    r=record(nextRef('CAP'),['Capital installment',member.values[0],dateText(v['Payment date']),peso(amount),'Posted'],'View',v);
    add('transactions',r);
  }else if(key==='funds'){
    if(demo.tables.funds.some(f=>f.values[0].toLowerCase()===v['Fund name'].toLowerCase()))throw new Error('A fund with this name already exists.');
    const amount=peso(v['Approved allocation']);r=record(nextRef('FND'),[v['Fund name'],amount,'₱0',amount,'0%'],'Open',v);
  }else if(key==='expenses'){
    const fund=byId('funds',v.Fund);
    if(Number(v['Amount requested'])>valueOfMoney(fund.values[3]))throw new Error('Requested amount exceeds the available fund balance.');
    r=record(nextRef('REQ'),[v.Purpose,v.Type,fund.values[0],peso(v['Amount requested']),'For approval'],'Review',v);
    addApproval(r,v.Type,r.values[3]);
  }else if(key==='liquidations'){
    const advance=byId('expenses',v['Released advance']),spent=Number(v['Supported spending']),cash=Number(v['Cash returned']);
    if(!advance||demo.tables.liquidations.some(l=>l.values[1]===advance.id))throw new Error('Select an available released advance.');
    if(Math.round((spent+cash)*100)!==Math.round(valueOfMoney(advance.values[3])*100))throw new Error('Receipts plus returned cash must total '+advance.values[3]+'.');
    r=record(nextRef('LIQ'),[advance.values[0],advance.id,advance.values[3],'Nov 20','For verification'],'Review',{...v,lines:[['Supported spending',v['Evidence reference'],peso(spent)],['Cash returned',v['Evidence reference'],peso(cash)]]});
    addApproval(r,'Liquidation',r.values[2]);
  }else if(key==='reports'){
    r=record(nextRef('RPT'),[v['Report type'],v.Period,'CSV','Ready'],'Preview',v);
  }else if(key==='meetings'){
    r=record(nextRef('MTG'),[v['Meeting title'],dateText(v['Meeting date']),v.Time,v.Venue],'Open agenda',{...v,agenda:v.Agenda});
  }else if(key==='meetings-documents'){
    const file=v.Document;
    if(!file?.size || file.size>262144 || !/\.(txt|pdf)$/i.test(file.name))throw new Error('Choose a PDF or text file of up to 256 KB.');
    const content=await readFileData(file);
    r=record(nextRef('DOC'),[v.Title,v.Type,dateText(demoDay),v.Audience,v.Publication],'View',{filename:file.name,content});
  }else if(key==='users-roles'){
    if(demo.tables[key].some(x=>x.extra.Email?.toLowerCase()===v.Email.toLowerCase()))throw new Error('An invitation already exists for this address.');
    r=record(nextRef('STAFF'),[v['Staff name'],v.Role,'Awaiting setup','Invited'],'View invite',v);
  }
  if(key!=='share-capital')add(key,r);
  const page=currentMenu()[0];selections[page]={tab:key==='meetings'?'Meetings':key==='share-capital'?'Transactions':'',filters:{},q:''};
  audit(plans[title][1],r.id,descriptions[title],'New',r.values[0]);
  committed({members:'Application saved',contributions:'Payment recorded','share-capital':'Capital payment posted',funds:'Budget created',expenses:'Request submitted',liquidations:'Liquidation submitted',reports:'Report ready',meetings:'Meeting scheduled','meetings-documents':'Document saved','users-roles':'Demo invitation created'}[key],r.id,key==='users-roles'?'The invitation is visible in Staff accounts. Email delivery is simulated.':`${r.values[0]} is now available in the ${registerInfo[key==='share-capital'?'transactions':key].headers[0].toLowerCase()} register.`);
}

const templateStatus=(value)=>{

function optionsFor(page,key,label){
  const rows=demo.tables[key],pick=index=>[...new Set(rows.map(r=>r.values[index]))];

  if(index!==undefined)return {choices:pick(index),match:(r,v)=>r.values[index]===v};
  if(label==='FY 2026')return {choices:['2026','2027'],match:(r,v)=>(r.extra['Fiscal year']||'2026')===v};

  if(page==='members'){set(0,284+active);set(1,demo.tables.members.filter(r=>r.values[2]==='Pending review').length);}
  if(page==='contributions'){set(0,peso(181750+posted));set(1,demo.tables.contributions.filter(r=>r.values[4]==='For verification').length);}
  if(page==='funds'){set(0,peso(approved));set(1,peso(used));set(2,peso(approved-used));}
  if(page==='liquidations')['For verification','Returned','Closed'].forEach((v,i)=>set(i,demo.tables.liquidations.filter(r=>r.values[4]===v).length));
  if(page==='approvals'){set(0,pending.length);set(1,pending.filter(r=>r.values[3]==='Nov 20').length);set(2,pending.filter(r=>r.values[3]!=='Nov 20').map(r=>r.values[3]).sort()[0]||'—');}
  if(page==='reports'){set(0,peso(181750+posted));set(2,demo.tables.reconciliation.filter(r=>r.values[3]!=='Matched').length);}
}
function decorate(page){
  const s=viewState(page);
  refreshSummary(page);
  syncPanels(page);
  const acct=document.querySelector('.account');acct.querySelector('b').textContent='Demo administrator';acct.querySelector('small').textContent='Client preview';acct.querySelector('.avatar').textContent='DA';
  document.querySelector('.brand b').textContent=demo.settings['Cooperative profile']?.['Cooperative name']||'LADTEMCO';
  document.querySelectorAll('.tabs span').forEach(span=>{
    const b=document.createElement('button');b.textContent=span.textContent;b.type='button';span.replaceWith(b);
    b.onclick=()=>{s.tab=b.textContent;s.filters={};s.q='';render();};
  });
  document.querySelectorAll('.filter').forEach(span=>{
    const b=document.createElement('button');b.className='filter';b.dataset.filter=span.textContent;b.type='button';span.replaceWith(b);b.onclick=()=>enumDialog(b.dataset.filter,page);
  });
  const search=document.querySelector('input[type=search]');
  if(search){search.value=s.q;search.oninput=()=>{s.q=search.value;drawRegister(page);};}
  if(registerInfo[page])drawRegister(page);
  document.querySelectorAll('button.button').forEach(b=>{
    const label=b.textContent.trim();
    if(plans[label])b.onclick=()=>startForm(label);
    else if(label.startsWith('Export'))b.onclick=()=>exportRegister(page);
    else if(label==='Review evidence')b.onclick=()=>detail('liquidations',byId('liquidations','LIQ-2026-014'));
    else if(label==='Review payment')b.onclick=()=>detail('contributions',byId('contributions','CON-2026-0041'));
    else if(label==='Open member record')b.onclick=()=>detail('members',byId('members','LAD-0241'));
    else if(label==='Open agenda')b.onclick=()=>detail('meetings',byId('meetings','MTG-2026-012'));
  });
  if(['settings','overview','meetings-documents','reports'].includes(page)){
    document.querySelectorAll('.list-entry').forEach((el,index)=>{
      const title=el.querySelector('strong')?.textContent;
      if(!title)return;
      // A button spans the complete row and retains native keyboard behavior.
      const b=document.createElement('button');b.className='list-entry action-entry';b.innerHTML=el.innerHTML;b.type='button';el.replaceWith(b);
      b.onclick=()=>openEntry(page,title,index);
    });
  }
  if(page==='settings')document.querySelectorAll('.action-entry').forEach(b=>{
    const v=demo.settings[b.querySelector('strong').textContent];
    if(v)b.querySelector('small').textContent=Object.values(v).join(' · ');
  });
}
window.decorateAdmin=decorate;
theme=demo.theme;
window.addEventListener('hashchange',closeDialog);
document.addEventListener('click',e=>{if(e.target.closest('#theme')){demo.theme=theme;persist();}});
for(const r of demo.tables.reports)r.values[2]='CSV';
render();
</script></body></html>
